<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="dialBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="85%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Bezel Ring -->
  <circle cx="256" cy="256" r="248" fill="#141416" stroke="#2c2d35" stroke-width="8" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#orangeGlow)" stroke-width="4" opacity="0.9" />

  <!-- Dial Face -->
  <circle cx="256" cy="256" r="228" fill="url(#dialBg)" />

  <!-- Gauge Arc Tick Marks -->
  <path d="M 100 370 A 180 180 0 1 1 412 370" fill="none" stroke="#333742" stroke-width="6" stroke-linecap="round" />
  <path d="M 100 370 A 180 180 0 0 1 256 76" fill="none" stroke="#ff6600" stroke-width="7" stroke-linecap="round" />

  <!-- Major Ticks -->
  <line x1="126" y1="344" x2="148" y2="322" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="88" y1="256" x2="118" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="126" y1="168" x2="148" y2="190" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="88" x2="256" y2="118" stroke="#ff6600" stroke-width="5" stroke-linecap="round" />
  <line x1="386" y1="168" x2="364" y2="190" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" />
  <line x1="424" y1="256" x2="394" y2="256" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" />

  <!-- Brand Text / Silhouette -->
  <text x="256" y="210" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">HARLEY</text>
  <text x="256" y="235" fill="#ff6600" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="3" text-anchor="middle">J1850 DIAGNOSTICS</text>

  <!-- Digital Readout Box -->
  <rect x="180" y="320" width="152" height="48" rx="8" fill="#08080a" stroke="#27272a" stroke-width="2" />
  <text x="256" y="352" fill="#22c55e" font-family="monospace" font-weight="900" font-size="24" text-anchor="middle">SCANNER</text>

  <!-- Needle pointing at ~3200 RPM -->
  <g transform="rotate(25, 256, 256)">
    <line x1="256" y1="256" x2="256" y2="92" stroke="#ff4500" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
    <line x1="256" y1="256" x2="256" y2="92" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Center Chrome Cap -->
  <circle cx="256" cy="256" r="28" fill="#222" stroke="#555" stroke-width="4" />
  <circle cx="256" cy="256" r="16" fill="#ff6600" />
</svg>
